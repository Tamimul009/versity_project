<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Cheese Craver</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#f59e0b;
      --muted:#9aa6b2;
      --glass: rgba(255,255,255,0.04);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(245,158,11,0.08), transparent),
                  linear-gradient(180deg, #071025 0%, #081223 100%),
                  var(--bg);
      color:#e6eef6;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    .container{
      width:100%;
      max-width:420px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:28px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
    }

    .brand{
      display:flex;gap:12px;align-items:center;margin-bottom:18px
    }
    .logo{
      width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--accent),#ffb86b);color:#071125;font-weight:700;font-size:18px;
      box-shadow: 0 6px 18px rgba(245,158,11,0.12);
    }
    h1{margin:0;font-size:20px}
    p.lead{margin:6px 0 18px;color:var(--muted);font-size:13px}

    form{display:flex;flex-direction:column;gap:12px}
    label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
    .field{
      background:var(--glass);
      border:1px solid rgba(255,255,255,0.03);
      padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:8px
    }
    input[type="text"], input[type="password"], input[type="tel"]{
      background:transparent;border:0;outline:none;color:inherit;width:100%;font-size:15px
    }

    .row{display:flex;gap:12px}
    .half{flex:1}

    .helper{font-size:12px;color:var(--muted)}

    .actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
    .remember{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
    .btn{
      background:linear-gradient(90deg,var(--accent),#ffb86b);
      color:#071125;padding:10px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(245,158,11,0.12);
    }
    .btn.secondary{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.03)}

    .meta{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}

    .toggle-pass{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px}

    .error{color:#ffb4b4;background:rgba(255,180,180,0.06);padding:8px;border-radius:8px;font-size:13px}
  </style>
</head>
<body>
  <main class="container" role="main">
    <div class="brand">
      <div class="logo">CC</div>
      <div>
        <h1>Cheese Craver — Sign in</h1>
        <p class="lead">Order delicious dishes near Gono Bishwabidyalay, Nolam, Savar.</p>
      </div>
    </div>

    <form id="loginForm" novalidate>
      <div>
        <label for="userid">Email:</label>
        <div class="field">
          <input id="userid" name="userid" type="text" inputmode="text" placeholder="your email:" required aria-required="true" />
        </div>
      </div>

      <div>
        <label for="password">Password</label>
        <div class="field">
          <input id="password" name="password" type="password" placeholder="Choose password" required aria-required="true" minlength="6" />
        </div>
        <div class="helper">At least 6 characters.</div>
      </div>
            <div>
        <label for="password">Your area name:</label>
        <div class="field">
          <input id="area" type="text" required aria-required="true" placeholder="e.g. khejurtake/pollibiddut"/>
        </div>
        <div class="helper">Your living area</div>
      </div>
      <div>
        <label for="phone">Phone</label>
        <div class="field">
          <input id="phone" name="phone" type="tel" placeholder="01XXXXXXXXX" pattern="\d{10,15}" inputmode="tel" required aria-required="true" />
        </div>
        <div class="helper">Enter digits only,11 characters.</div>
      </div>
      <div class="actions">
        <label class="remember"><input type="checkbox" id="remember" /> Remember me</label>
        <button type="reset" class="btn">Sign Up</button>
      </div>
    </form>
  </main>
</body>
</html>
