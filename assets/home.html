<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePage</title>
    <link rel="stylesheet" href="../style/home.css">
</head>
<body class="container">
    <header class="header">
        <div class="h1">
            <div class="h11"><img src="special/chicken-dom-polao.jpg" alt=""></div>
        <div><h1>Special offer going on</h1>
        <h3>Chicken-dom-polao</h3>
        <p>Price=300Tk</p>
        <button onclick="addToCart('Chicken-dom-polao', 300)">Add to Cart</button>
        </div>
        </div>
    </header>
    <aside class="aside">
     <div class="box">
        <h2>Welcome to the <br>
        <p id="c1">Cheese Craver</p></h2>
     </div>
    </aside>
    <main class="main">
        <div class="h2">
            <div class="h21"><img src="special/Gbiryani.jpg" alt=""></div>
        <div><h1>Special offer going on</h1>
        <h3>Special-Biriani</h3>
        <p>Price=250Tk</p>
        <button onclick="addToCart('Special-Biriani', 250)">Add to Cart</button>
        </div>
        </div>
    </main>
    <footer class="footer">
        <div class="h3">
            <div class="h31"><img src="special/papror-rice-thali.jpg" alt=""></div>
        <div><h1>Special offer going on</h1>
        <h3>Papor-rice-thali</h3>
        <p>Price=300Tk</p>
        <button onclick="addToCart('Papor-rice-thali', 300)">Add to Cart</button>
        </div>
        </div>
    </footer>
    <button id="cart-btn">🛒 Cart</button>
<section class="sss section" id="cart-popup">
  <script>
  let cart = [];

  // Add item to cart
  function addToCart(name, price) {
    let existing = cart.find(item => item.name === name);
    if (existing) {
      existing.quantity += 1;
    } else {
      cart.push({ name, price, quantity: 1 });
    }
    displayCart();
  }

  // Remove item from cart
  function removeFromCart(name) {
    cart = cart.filter(item => item.name !== name);
    displayCart();
  }

  // Display the cart items
  function displayCart() {
    let cartDiv = document.getElementById("cart-popup");
    cartDiv.innerHTML = `<h2>Your Cart</h2>`;

    if (cart.length === 0) {
      cartDiv.innerHTML += `<p>Cart is empty</p>`;
      return;
    }

    let total = 0;
    cart.forEach(item => {
      total += item.price * item.quantity;
      cartDiv.innerHTML += `
        <div class="cart-item">
          <span>${item.name} (x${item.quantity})</span>
          <span>${item.price * item.quantity} TK</span>
          <button onclick="removeFromCart('${item.name}')">Remove</button>
        </div>
      `;
    });

    // Add total and Buy Now button
    cartDiv.innerHTML += `
      <hr>
      <h3>Total: ${total} TK</h3>
      <a href="checkout.html" id="buy-now-btn">Buy Now</a>
    `;
  }

  // Toggle popup visibility
  const cartBtn = document.getElementById('cart-btn');
  const cartPopup = document.getElementById('cart-popup');

  cartBtn.addEventListener('click', () => {
    cartPopup.classList.toggle('active');
  });

  // Optional: close popup when clicking outside
  window.addEventListener('click', (e) => {
    if (!cartPopup.contains(e.target) && e.target !== cartBtn) {
      cartPopup.classList.remove('active');
    }
  });
</script>
</section>
</body>
</html>
